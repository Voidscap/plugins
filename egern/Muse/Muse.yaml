# Muse 分流规则集（Egern 版）
# 由 Surge 版 surge/Muse/Muse.list 转化而来，17 条规则逐条对照，无增减。
# Surge 版：https://raw.githubusercontent.com/Voidscap/plugins/main/surge/Muse/Muse.list
# 用法：Egern → 模块 → 添加模块，粘贴 raw 链接
#   https://raw.githubusercontent.com/Voidscap/plugins/main/egern/Muse/Muse.yaml
# 规则说明：Muse + Instagram + Facebook 的域名全部走代理（PROXY）。
# 注意：Egern 里 PROXY 就是默认代理组；想走指定策略组，把 PROXY 换成组名。
name: Muse 分流
description: Muse、Instagram、Facebook 的域名走代理
author: Voidscap
homepage: https://github.com/Voidscap/plugins

rules:
  # Muse / Meta AI
  - DOMAIN-SUFFIX,muse.ai,PROXY
  - DOMAIN-SUFFIX,meta.ai,PROXY
  - DOMAIN-SUFFIX,metaaivm.com,PROXY
  - DOMAIN-SUFFIX,meta.com,PROXY
  - DOMAIN-SUFFIX,metaaiusercontent.com,PROXY
  # Instagram
  - DOMAIN-SUFFIX,instagram.com,PROXY
  - DOMAIN-SUFFIX,cdninstagram.com,PROXY
  - DOMAIN-SUFFIX,instagramstatic-a.akamaihd.net,PROXY
  # Facebook
  - DOMAIN-SUFFIX,facebook.com,PROXY
  - DOMAIN-SUFFIX,facebook.net,PROXY
  - DOMAIN-SUFFIX,fb.com,PROXY
  - DOMAIN-SUFFIX,fb.me,PROXY
  - DOMAIN-SUFFIX,fb.watch,PROXY
  - DOMAIN-SUFFIX,fb.gg,PROXY
  - DOMAIN-SUFFIX,messenger.com,PROXY
  - DOMAIN-SUFFIX,fbsbx.com,PROXY
  # Meta 共用 CDN
  - DOMAIN-SUFFIX,fbcdn.net,PROXY
